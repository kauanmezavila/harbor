[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Harbor"
version = "1.3.0"
description = "Harbor command CLI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "cryptography",
    "pathspec",
    "requests",
    "PyYAML",
]

[project.scripts]
harbor = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ContainerStuff*"]
namespaces = true

[tool.setuptools.package-data]
ContainerStuff = ["**/.harbignore"]
