project: HarborBeacon
description: Same fictional project packaged as HarborSpecs variants by OS, architecture, and version.

variants:
  - path: any/v1.1
    version: 1.1.0
    os: Any
    architecture: Any
    runtime: python>=3.12

  - path: any/v1.2
    version: 1.2.0
    os: Any
    architecture: Any
    runtime: python>=3.12

  - path: linux/v1.0
    version: 1.0.0
    os: linux
    architecture: x86_64
    runtime: python>=3.12

  - path: linux/v1.1
    version: 1.1.0
    os: linux
    architecture: arm64
    runtime: python>=3.12

  - path: linux/v1.2
    version: 1.2.0
    os: linux
    architecture: x86_64, arm64
    runtime: python>=3.12

  - path: mac/v1.2
    version: 1.2.0
    os: macos
    architecture: arm64
    runtime: python>=3.12

  - path: windows/v1.1
    version: 1.1.0
    os: windows
    architecture: x86_64
    runtime: python>=3.12
