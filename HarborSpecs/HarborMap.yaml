project: HarborBeacon
description: Same fictional project packaged as HarborSpecs variants by OS, architecture, and version.

variants:
  - type: .harb
    path: any/v1.1/HarborBeacon-Any-Any-[HARBOR].harb
    version: 1.1.0
    os: Any
    architecture: Any
    runtime: python>=3.12

  - type: .harb
    path: any/v1.2/HarborBeacon-Any-Any-[HARBOR].harb
    version: 1.2.0
    os: Any
    architecture: Any
    runtime: python>=3.12

  - type: .harb
    path: linux/v1.0/HarborBeacon-x86_64-linux-[HARBOR].harb
    version: 1.0.0
    os: linux
    architecture: x86_64
    runtime: python>=3.12

  - type: .harb
    path: linux/v1.1/HarborBeacon-arm64-linux-[HARBOR].harb
    version: 1.1.0
    os: linux
    architecture: arm64
    runtime: python>=3.12

  - type: .harb
    path: linux/v1.2/HarborBeacon-x86_64-arm64-linux-[HARBOR].harb
    version: 1.2.0
    os: linux
    architecture: x86_64, arm64
    runtime: python>=3.12

  - type: .harb
    path: mac/v1.2/HarborBeacon-arm64-macos-[HARBOR].harb
    version: 1.2.0
    os: macos
    architecture: arm64
    runtime: python>=3.12

  - type: .harb
    path: windows/v1.1/HarborBeacon-x86_64-windows-[HARBOR].harb
    version: 1.1.0
    os: windows
    architecture: x86_64
    runtime: python>=3.12

  - type: url
    url: https://example.invalid/harborbeacon/install.sh
    command: echo "[HARBOR] simulated install for linux x86_64"
    version: 2.0.0
    os: linux
    architecture: x86_64
    runtime: python>=3.12

  - type: url
    url: https://example.invalid/harborbeacon/install.ps1
    command: echo "[HARBOR] simulated install for windows x86_64"
    version: 2.0.0
    os: windows
    architecture: x86_64
    runtime: python>=3.12

  - type: url
    url: https://example.invalid/harborbeacon/install.sh
    command: echo "[HARBOR] simulated install for macos arm64"
    version: 2.0.0
    os: macos
    architecture: arm64
    runtime: python>=3.12
